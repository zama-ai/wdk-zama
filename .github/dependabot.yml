version: 2
updates:
  # One npm workspace: "/" covers the shared lockfile for both packages and the demo app.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # TypeScript 7 drops JSDoc @private/@protected from emitted .d.ts, exposing internals as public API.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      # react-dom pins react exactly; bumping one alone breaks the demo at runtime.
      react:
        patterns: [react, react-dom]
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The sharp stub is not a workspace. The root "overrides" points sharp to it with a file: reference,
  # so the "/" entry does not cover it.
  - package-ecosystem: npm
    directory: /apps/wallet-demo/stubs/sharp
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
